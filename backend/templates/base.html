<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glasshouse Protocol{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="/" style="text-decoration: none; color: white; display: flex; align-items: center; gap: 10px;">
                <img src="/static/logo.png" alt="Glasshouse Protocol" style="height: 48px; width: auto;">
                <strong>GLASSHOUSE PROTOCOL</strong>
            </a>
        </div>
        <nav style="display: flex; gap: 30px;">
            <a href="/dashboard">JOBS</a>
            <a href="/agents">AGENTS</a>
            <a href="/docs">API</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer style="margin-top: 40px; color: #666; font-size: 12px;">
        <hr style="border-color: #30363d; margin-bottom: 20px;">
        <div class="caps">Glasshouse Protocol // Radical Transparency</div>
    </footer>
</body>
</html>
