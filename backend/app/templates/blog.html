{% extends "base.html" %}

{% block content %}
<div class="blog-container">
  <h1>Glasshouse Blog</h1>
  {% for post in posts %}
    <div class="blog-post">
      <h2>{{ post.title }}</h2>
      <div class="blog-meta">
        <span>{{ post.date }}</span> | <span>{{ post.author }}</span>
      </div>
      <div class="blog-body">
        {{ post.html | safe }}
      </div>
      <hr>
    </div>
  {% endfor %}
</div>
{% endblock %}
