name: Size Guard
on: [push, pull_request]

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check File and Repo Limits
        run: |
          # 100MB limit
          MAX_FILE=100000000
          # 5GB limit
          MAX_REPO=5000000000

          echo "Checking for file limits..."
          LARGE_FILES=$(find . -type f -not -path '*/.*' -size +${MAX_FILE}c)
          
          if [ -n "$LARGE_FILES" ]; then
            echo "FAILED: Files too large:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "Checking total repo size..."
          REPO_SIZE=$(du -sb . | cut -f1)
          if [ "$REPO_SIZE" -gt "$MAX_REPO" ]; then
            echo "FAILED: Repo size ($REPO_SIZE bytes) exceeds limit."
            exit 1
          fi
          
          echo "Size check passed!"
          
